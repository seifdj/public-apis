<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03080f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="local-runtime.js"></script>
</head>
<body>
<title>Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: HUD holographique — rail de commande à gauche, panneaux translucides cerclés de repères d'angle sur une grille animée */
:root {
  --bg: #03080f;
  --bg2: #071422;
  --surface: rgba(10, 32, 52, .55);
  --sunken: rgba(58, 214, 255, .07);
  --line: rgba(58, 214, 255, .22);
  --ink: #d6f4ff;
  --muted: #6fa3bd;
  --accent: #3ad6ff;
  --accent-soft: rgba(58, 214, 255, .14);
  --glow: 0 0 12px rgba(58, 214, 255, .55);
  --gold: #ffb547;
  --good: #3cf2a8;
  --good-soft: rgba(60, 242, 168, .14);
  --warn: #ffb547;
  --warn-soft: rgba(255, 181, 71, .14);
  --bad: #ff4d63;
  --bad-soft: rgba(255, 77, 99, .15);
  --font-display: "Orbitron", "Rajdhani", system-ui, sans-serif;
  --font-body: "Rajdhani", "Segoe UI", system-ui, sans-serif;
  --font-data: "Share Tech Mono", ui-monospace, Menlo, monospace;
  --radius: 4px;
  --cut: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: radial-gradient(1200px 700px at 75% 85%, rgba(58, 214, 255, .10), transparent 60%), radial-gradient(900px 600px at 10% 0%, rgba(255, 181, 71, .05), transparent 60%), var(--bg);
  color: var(--ink); font-family: var(--font-body); font-size: 16px; font-weight: 500; line-height: 1.45;
}
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: linear-gradient(rgba(58, 214, 255, .045) 1px, transparent 1px), linear-gradient(90deg, rgba(58, 214, 255, .045) 1px, transparent 1px);
  background-size: 44px 44px; mask-image: radial-gradient(ellipse at center, #000 40%, transparent 85%); }
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 3;
  background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .018) 0 1px, transparent 1px 3px); }
#hud { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; box-shadow: var(--glow); }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; letter-spacing: .02em; }

.app { position: relative; z-index: 1; display: grid; grid-template-columns: 230px minmax(0, 1fr); min-height: 100%; }
.rail { background: linear-gradient(180deg, rgba(7, 24, 40, .85), rgba(3, 10, 18, .85)); border-right: 1px solid var(--line); box-shadow: inset -1px 0 18px rgba(58, 214, 255, .08);
  padding: 22px 14px; display: flex; flex-direction: column; gap: 22px; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; backdrop-filter: blur(6px); }
.brand { display: flex; align-items: center; gap: 10px; padding-inline: 4px; }
.brand .reactor { width: 42px; height: 42px; flex: none; }
.brand h1 { font-family: var(--font-display); font-size: 17px; letter-spacing: .28em; margin: 0; color: var(--accent); text-shadow: var(--glow); }
.brand small { display: block; font-family: var(--font-data); font-size: 10px; letter-spacing: .12em; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 3px; }
.nav button { all: unset; cursor: pointer; padding: 8px 12px; color: var(--muted); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 13px;
  display: flex; justify-content: space-between; align-items: center; border-left: 2px solid transparent; transition: color .2s, background .2s, border-color .2s; }
.nav button:hover { color: var(--ink); background: var(--sunken); border-left-color: var(--line); }
.nav button[aria-current="page"] { color: var(--accent); background: linear-gradient(90deg, var(--accent-soft), transparent); border-left-color: var(--accent); text-shadow: var(--glow); }
.nav button:focus-visible { outline: 1px solid var(--accent); }
.nav .count { font-family: var(--font-data); font-size: 12px; }
.rail-foot { margin-top: auto; font-size: 12px; color: var(--muted); padding-inline: 4px; display: flex; flex-direction: column; gap: 6px; font-family: var(--font-data); }
.rail-foot select { background: var(--bg2); border: 1px solid var(--line); padding: 4px 6px; color: var(--accent); }
.clock { font-family: var(--font-data); font-size: 22px; color: var(--accent); text-shadow: var(--glow); letter-spacing: .06em; }
.who::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 8px var(--good); margin-right: 6px; vertical-align: 1px; }

main { padding-block: 26px 96px; padding-inline: 32px; min-width: 0; max-width: 1240px; width: 100%; }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
.head h2 { font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: .08em; text-transform: uppercase; margin: 0; text-wrap: balance; color: var(--ink); text-shadow: 0 0 18px rgba(58, 214, 255, .35); }
.head p { margin: 4px 0 0; color: var(--muted); }
.eyebrow { text-transform: uppercase; letter-spacing: .18em; font-size: 11px; font-weight: 700; color: var(--accent); font-family: var(--font-data); }

.btn { border: 1px solid var(--line); background: rgba(58, 214, 255, .06); padding: 7px 16px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 13px; cursor: pointer; clip-path: var(--cut); transition: background .2s, box-shadow .2s, color .2s; }
.btn:hover { background: var(--accent-soft); color: var(--accent); box-shadow: var(--glow); }
.btn.primary { background: linear-gradient(180deg, rgba(58, 214, 255, .9), rgba(20, 150, 200, .9)); border-color: var(--accent); color: #021019; }
.btn.primary:hover { color: #021019; box-shadow: 0 0 22px rgba(58, 214, 255, .8); }
.btn.danger { color: var(--bad); border-color: rgba(255, 77, 99, .4); }
.btn.small { padding: 3px 10px; font-size: 11px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; box-shadow: none; }

/* Repères d'angle holographiques */
.panel, .kpi, .company, .chat { position: relative; }
.panel::before, .kpi::before, .company::before, .chat::before { content: ""; position: absolute; inset: -1px; pointer-events: none;
  background: linear-gradient(var(--accent), var(--accent)) 0 0 / 14px 2px, linear-gradient(var(--accent), var(--accent)) 0 0 / 2px 14px,
    linear-gradient(var(--accent), var(--accent)) 100% 0 / 14px 2px, linear-gradient(var(--accent), var(--accent)) 100% 0 / 2px 14px,
    linear-gradient(var(--accent), var(--accent)) 0 100% / 14px 2px, linear-gradient(var(--accent), var(--accent)) 0 100% / 2px 14px,
    linear-gradient(var(--accent), var(--accent)) 100% 100% / 14px 2px, linear-gradient(var(--accent), var(--accent)) 100% 100% / 2px 14px;
  background-repeat: no-repeat; filter: drop-shadow(0 0 4px rgba(58, 214, 255, .8)); }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
.kpi { background: var(--surface); border: 1px solid var(--line); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; overflow: hidden; backdrop-filter: blur(4px); }
.kpi::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%; pointer-events: none; background: linear-gradient(90deg, transparent, rgba(58, 214, 255, .10), transparent); }
.kpi .val { font-family: var(--font-data); font-size: 26px; color: var(--accent); text-shadow: var(--glow); }
.kpi .sub { font-size: 13px; color: var(--muted); }
.pos { color: var(--good) !important; text-shadow: 0 0 10px rgba(60, 242, 168, .5); } .neg { color: var(--bad) !important; text-shadow: 0 0 10px rgba(255, 77, 99, .5); }

.grid2 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); padding: 16px 18px; min-width: 0; display: flex; flex-direction: column; gap: 12px; backdrop-filter: blur(4px); box-shadow: inset 0 0 30px rgba(58, 214, 255, .04); }
.panel h3 { margin: 0; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); font-family: var(--font-display); font-weight: 500; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 16px; }

.goal { display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-top: 1px dashed var(--line); cursor: pointer; }
.goal:first-of-type { border-top: 0; }
.goal-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.goal-title { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.bar { height: 6px; background: rgba(58, 214, 255, .08); border: 1px solid var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, rgba(58, 214, 255, .4), var(--accent)); box-shadow: var(--glow); }
.bar i.done { background: linear-gradient(90deg, rgba(60, 242, 168, .4), var(--good)); }
.goal-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }

.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 2px 8px; border: 1px solid currentColor; background: transparent; color: var(--muted); white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; background: currentColor; box-shadow: 0 0 6px currentColor; }
.chip.en_cours, .chip.active, .chip.contacte { color: var(--accent); }
.chip.termine, .chip.gagne { color: var(--good); }
.chip.pause, .chip.late, .chip.devis { color: var(--warn); }
.chip.idee, .chip.projet, .chip.prospect { color: var(--muted); }
.chip.perdu { color: var(--bad); }

.list { display: flex; flex-direction: column; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px dashed var(--line); cursor: pointer; }
.row:first-child { border-top: 0; }
.row .main { min-width: 0; display: flex; flex-direction: column; }
.row .main strong { overflow-wrap: anywhere; }
.row .main small { color: var(--muted); overflow-wrap: anywhere; }

.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.col { background: rgba(58, 214, 255, .04); border: 1px solid var(--line); padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.col h4 { margin: 2px 4px 4px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); display: flex; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
.card { background: rgba(3, 12, 22, .75); border: 1px solid var(--line); border-left: 2px solid var(--accent); padding: 9px 11px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; transition: box-shadow .2s, transform .2s; }
.card:hover { box-shadow: var(--glow); transform: translateX(2px); }
.card:hover strong, .row:hover .main strong, .goal:hover .goal-title { color: var(--accent); text-shadow: var(--glow); }
.card small { color: var(--muted); overflow-wrap: anywhere; }

.companies { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.company { background: var(--surface); border: 1px solid var(--line); padding: 16px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; transition: box-shadow .25s; backdrop-filter: blur(4px); }
.company:hover { box-shadow: 0 0 24px rgba(58, 214, 255, .25), inset 0 0 24px rgba(58, 214, 255, .06); }
.company h4 { margin: 0; font-family: var(--font-display); font-weight: 700; letter-spacing: .06em; font-size: 15px; text-transform: uppercase; overflow-wrap: anywhere; }
.company dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 14px; }
.company dt { color: var(--muted); } .company dd { margin: 0; text-align: right; color: var(--accent); }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--accent); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); font-family: var(--font-data); }
td { padding: 9px 10px; border-bottom: 1px dashed var(--line); }
tbody tr { cursor: pointer; } tbody tr:hover { background: var(--sunken); }
td.amt, th.amt { text-align: right; }

.chart svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 0 4px rgba(58, 214, 255, .25)); }
.chart text { fill: var(--muted); font-family: var(--font-data); font-size: 10px; }
.legend { display: flex; gap: 14px; font-size: 11px; color: var(--muted); letter-spacing: .06em; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px; background: var(--c); box-shadow: 0 0 6px var(--c); }

.empty { color: var(--muted); font-size: 15px; padding: 8px 0; }
.empty button { margin-top: 8px; }
.notice { background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn); padding: 10px 14px; font-size: 15px; margin-bottom: 16px; }

/* Chat */
.chat { display: flex; flex-direction: column; height: calc(100vh - 150px); min-height: 460px; background: var(--surface); border: 1px solid var(--line); backdrop-filter: blur(4px); }
.msgs { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 75ch; padding: 10px 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.user { align-self: flex-end; background: var(--accent-soft); border: 1px solid var(--accent); color: var(--ink); clip-path: var(--cut); }
.msg.assistant { align-self: flex-start; background: rgba(3, 12, 22, .7); border-left: 2px solid var(--accent); }
.msg.assistant::before { content: "JARVIS"; display: block; font-family: var(--font-data); font-size: 10px; letter-spacing: .2em; color: var(--accent); margin-bottom: 2px; }
.msg.tool { align-self: flex-start; font-size: 12px; color: var(--good); padding: 2px 4px; font-family: var(--font-data); }
.composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); align-items: center; }
.composer textarea { flex: 1; resize: none; border: 1px solid var(--line); background: rgba(3, 12, 22, .8); padding: 9px 12px; min-height: 44px; max-height: 140px; }
.suggest { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 12px; }
.suggest button { border: 1px solid var(--line); background: transparent; padding: 4px 12px; font-size: 13px; cursor: pointer; color: var(--muted); clip-path: var(--cut); }
.suggest button:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.quick { display: flex; gap: 8px; }
.quick input { flex: 1; min-width: 0; border: 1px solid var(--line); background: rgba(3, 12, 22, .8); padding: 8px 12px; }
.brief { white-space: pre-wrap; font-size: 15px; }

/* Fiche entreprise & pipeline */
.crumb { all: unset; cursor: pointer; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
.crumb:hover { color: var(--accent); }
.pipe { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.pipe .col h4 small { color: var(--muted); font-weight: 500; }
.card .card-foot { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: 2px; }
.adv { border: 1px solid var(--line); background: transparent; padding: 1px 8px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; color: var(--muted); }
.adv:hover { color: var(--accent); border-color: var(--accent); box-shadow: var(--glow); }
.due { color: var(--warn); font-weight: 700; }
.services { display: flex; flex-wrap: wrap; gap: 6px; }
.services span { border: 1px solid var(--accent); color: var(--accent); background: var(--accent-soft); padding: 3px 10px; font-size: 13px; font-weight: 700; letter-spacing: .04em; clip-path: var(--cut); }
.contact { font-family: var(--font-data); font-size: 12px; user-select: all; }

/* Réacteur ARK */
.reactor { display: block; overflow: visible; }
.reactor circle, .reactor path { fill: none; stroke: var(--accent); }
.reactor .r-out { stroke-width: 1.5; opacity: .5; }
.reactor .r-dash { stroke-width: 3; stroke-dasharray: 4 6; opacity: .8; }
.reactor .r-arc { stroke-width: 2.5; stroke-dasharray: 60 30 20 30; opacity: .9; }
.reactor .r-seg rect { fill: rgba(58, 214, 255, .55); stroke: none; }
.reactor .r-core { fill: #e9fbff; stroke: var(--accent); stroke-width: 3; filter: drop-shadow(0 0 6px var(--accent)) drop-shadow(0 0 14px var(--accent)); }
.reactor .r-ring { stroke-width: 1; opacity: .6; }
.reactor g, .reactor circle { transform-box: view-box; transform-origin: 50px 50px; }
.chat-top { display: flex; align-items: center; gap: 18px; padding: 14px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.orb { width: 92px; height: 92px; flex: none; cursor: pointer; }
.orb .reactor { width: 100%; height: 100%; }
.orb[data-state="listening"] .reactor circle, .orb[data-state="listening"] .reactor path { stroke: var(--bad); }
.orb[data-state="listening"] .r-seg rect { fill: rgba(255, 77, 99, .6); }
.orb[data-state="listening"] .r-core { stroke: var(--bad); filter: drop-shadow(0 0 8px var(--bad)) drop-shadow(0 0 18px var(--bad)); }
.orb[data-state="thinking"] .reactor circle, .orb[data-state="thinking"] .reactor path { stroke: var(--gold); }
.orb[data-state="thinking"] .r-core { stroke: var(--gold); filter: drop-shadow(0 0 8px var(--gold)); }
.orb-label { font-family: var(--font-data); font-size: 14px; letter-spacing: .06em; color: var(--accent); flex: 1; min-width: 160px; text-shadow: var(--glow); }
.orb-label::after { content: "_"; margin-left: 2px; }
.wave { display: flex; gap: 3px; align-items: center; height: 28px; }
.wave i { width: 3px; height: 6px; background: var(--accent); box-shadow: var(--glow); }
.mic { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--accent); background: var(--accent-soft); cursor: pointer; display: grid; place-items: center; flex: none; box-shadow: var(--glow); }
.mic svg { width: 20px; height: 20px; fill: var(--accent); }
.mic[aria-pressed="true"] { background: var(--bad); border-color: var(--bad); box-shadow: 0 0 18px var(--bad); }
.mic[aria-pressed="true"] svg { fill: #fff; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; color: var(--muted); }
.toggle input { accent-color: var(--accent); }

.voice-pick { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.voice-pick select { background: var(--bg2); border: 1px solid var(--line); color: var(--accent); padding: 4px 8px; max-width: 220px; font-family: var(--font-data); font-size: 13px; }

/* Bouton Démarrer Jarvis */
.btn.start[aria-pressed="true"] { background: linear-gradient(180deg, rgba(255, 77, 99, .95), rgba(190, 30, 55, .95)); border-color: var(--bad); color: #fff; box-shadow: 0 0 18px rgba(255, 77, 99, .6); }
.fab { position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 20; display: flex; align-items: center; gap: 10px;
  padding: 6px 18px 6px 6px; border: 1px solid var(--accent); border-radius: 40px; background: rgba(3, 14, 24, .92); color: var(--accent); cursor: pointer;
  font-family: var(--font-display); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; box-shadow: 0 0 22px rgba(58, 214, 255, .35); backdrop-filter: blur(6px); }
.fab .reactor { width: 46px; height: 46px; }
.fab:hover { box-shadow: 0 0 32px rgba(58, 214, 255, .6); }
.fab[data-on="1"] { border-color: var(--bad); color: var(--bad); box-shadow: 0 0 26px rgba(255, 77, 99, .45); }
.fab[data-state="listening"] .reactor circle { stroke: var(--bad); }
.fab[data-state="thinking"] .reactor circle { stroke: var(--gold); }

/* Séquence de démarrage */
.boot { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: grid; place-items: center; pointer-events: none; opacity: 0; visibility: hidden; }
.boot-in { display: flex; flex-direction: column; align-items: center; gap: 14px; padding-inline: 16px; text-align: center; }
.boot .reactor { width: 140px; height: 140px; }
.boot-title { font-family: var(--font-display); font-size: 28px; letter-spacing: .5em; color: var(--accent); text-shadow: var(--glow); padding-left: .5em; }
.boot-lines { font-family: var(--font-data); font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; min-height: 80px; }

/* Formulaires */
dialog { border: 1px solid var(--accent); background: rgba(5, 18, 30, .96); color: var(--ink); padding: 0; width: min(500px, calc(100vw - 32px)); box-shadow: 0 0 40px rgba(58, 214, 255, .3); }
dialog::backdrop { background: rgba(1, 5, 10, .7); backdrop-filter: blur(3px); }
dialog form { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
dialog h3 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 16px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); text-shadow: var(--glow); }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-family: var(--font-data); }
.field input, .field select, .field textarea { border: 1px solid var(--line); background: rgba(3, 12, 22, .9); padding: 8px 10px; width: 100%; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); box-shadow: var(--glow); outline: none; }
.field .hint { font-size: 12px; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 4px; }
.actions .spacer { flex: 1; }

@media (max-width: 1000px) {

  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }

}
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 10px 16px; gap: 10px; border-right: 0; border-bottom: 1px solid var(--line); }
  .brand .reactor { width: 32px; height: 32px; }
  .nav { flex-direction: row; overflow-x: auto; gap: 4px; width: 100%; order: 3; }
  .nav button { white-space: nowrap; padding: 6px 10px; border-left: 0; border-bottom: 2px solid transparent; }
  .nav button[aria-current="page"] { border-bottom-color: var(--accent); }
  .nav .count { display: none; }
  .rail-foot { margin: 0 0 0 auto; flex-direction: row; align-items: center; }

  main { padding-inline: 16px; padding-block: 18px 40px; }
  .board, .pipe { grid-template-columns: minmax(0, 1fr); }
  .chat { height: calc(100vh - 210px); }
  .orb { width: 64px; height: 64px; }
  .fab { padding: 4px; right: 14px; } .fab .fab-label { display: none; }
  main { padding-block-end: 90px; }
  .head h2 { font-size: 20px; }
  .kpi .val { font-size: 21px; }
}
@media (prefers-reduced-motion: no-preference) {
  .bar i { transition: width .6s ease; }
  .reactor .r-dash { animation: spin 14s linear infinite; }
  .reactor .r-arc { animation: spin 7s linear infinite reverse; }
  .reactor .r-seg { animation: spin 22s linear infinite; }
  .reactor .r-core { animation: pulse 2.6s ease-in-out infinite; }
  .orb[data-state="speaking"] .r-dash { animation-duration: 2s; }
  .orb[data-state="speaking"] .r-arc { animation-duration: 1.2s; }
  .orb[data-state="speaking"] .r-core { animation: pulse .45s ease-in-out infinite; }
  .orb[data-state="thinking"] .r-arc { animation-duration: .9s; }
  .orb[data-state="thinking"] .r-seg { animation-duration: 3s; }
  .orb[data-state="listening"] .r-core { animation: pulse .7s ease-in-out infinite; }
  .orb[data-state="speaking"] ~ .wave i, .orb[data-state="listening"] ~ .wave i { animation: eq .5s ease-in-out infinite alternate; }
  .wave i:nth-child(2) { animation-delay: .1s !important; } .wave i:nth-child(3) { animation-delay: .25s !important; } .wave i:nth-child(4) { animation-delay: .05s !important; } .wave i:nth-child(5) { animation-delay: .3s !important; } .wave i:nth-child(6) { animation-delay: .15s !important; }
  .kpi::after { animation: sweep 7s ease-in-out infinite; }
  .kpi:nth-child(2)::after { animation-delay: 1.2s; } .kpi:nth-child(3)::after { animation-delay: 2.4s; } .kpi:nth-child(4)::after { animation-delay: 3.6s; }
  .orb-label::after { animation: blink 1s steps(1) infinite; }
  .boot { visibility: visible; animation: bootOut .5s ease 2.1s forwards; opacity: 1; }
  .boot-lines span { opacity: 0; animation: lineIn .3s ease forwards; }
  .boot-lines span:nth-child(1) { animation-delay: .3s; } .boot-lines span:nth-child(2) { animation-delay: .7s; } .boot-lines span:nth-child(3) { animation-delay: 1.1s; } .boot-lines span:nth-child(4) { animation-delay: 1.5s; color: var(--accent); }
  .boot .reactor { animation: zoomIn 1s ease both; }
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .7; } }
@keyframes eq { from { height: 4px; } to { height: 26px; } }
@keyframes sweep { 0%, 70% { left: -60%; } 100% { left: 130%; } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes bootOut { to { opacity: 0; visibility: hidden; } }
@keyframes lineIn { to { opacity: 1; } }
@keyframes zoomIn { from { transform: scale(.4) rotate(-90deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes rise { from { transform: translateY(6px); } to { transform: none; } }
</style>

<div class="boot" aria-hidden="true"><div class="boot-in"><span class="reactor-slot"></span><div class="boot-title">J.A.R.V.I.S.</div>

<button type="button" class="fab" id="fab" data-convo aria-pressed="false" title="Démarrer une conversation vocale avec Jarvis"><span class="reactor-slot"></span><span class="fab-label">Démarrer Jarvis</span></button>

<dialog id="dlg"><form id="dlgForm" method="dialog"></form></dialog>

<script>
const SECTIONS = [
  { id: "accueil", label: "Tableau de bord" },
  { id: "objectifs", label: "Objectifs", col: "goals" },
  { id: "projets", label: "Projets", col: "projects" },
  { id: "entreprises", label: "Entreprises", col: "companies" },
  { id: "clients", label: "Clients", col: "clients" },
  { id: "finances", label: "Finances", col: "transactions" },
  { id: "jarvis", label: "Parler à Jarvis" },
];
const PROJECT_STATUS = { idee: "Idée", en_cours: "En cours", pause: "En pause", termine: "Terminé" };
const COMPANY_STATUS = { active: "Active", projet: "Future / en projet" };
const STAGES = { prospect: "Prospect", contacte: "Contacté", devis: "Devis envoyé", gagne: "Client gagné", perdu: "Perdu" };
const STAGE_ORDER = Object.keys(STAGES);
const OPEN_STAGES = ["prospect", "contacte", "devis"];
const COLS = ["goals", "projects", "companies", "transactions", "clients"];

const S = { goals: [], projects: [], companies: [], transactions: [], clients: [], chat: [], settings: { currency: "EUR" }, loaded: {} };
let db = null, sample = null, ready = false, offline = false;
let view = "accueil";
let currentCompany = null;
let orbState = "";
let voiceOn = false;
try { voiceOn = localStorage.getItem("jarvis-voice") === "1"; } catch (e) {}
let pending = null; // réponse de Jarvis en cours d'écriture
let busy = false;
let briefing = "";

try { const h = (location.hash || "").slice(1); if (SECTIONS.some(s => s.id === h)) view = h; } catch (e) {}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const n = v => { const x = Number(v); return Number.isFinite(x) ? x : 0; };
function money(v, compact) {
  try {
    return new Intl.NumberFormat("fr-FR", { style: "currency", currency: S.settings.currency || "EUR", maximumFractionDigits: compact ? 0 : 2, notation: compact && Math.abs(v) >= 100000 ? "compact" : "standard" }).format(n(v));
  } catch (e) { return n(v).toFixed(2) + " " + S.settings.currency; }
}
const today = () => new Date().toISOString().slice(0, 10);
const monthKey = d => String(d || "").slice(0, 7);
function fmtDate(d) { if (!d) return ""; const x = new Date(d + "T12:00:00"); return isNaN(x) ? d : x.toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "numeric" }); }
function monthsUntil(d) {
  if (!d) return null; const t = new Date(d + "T12:00:00"); if (isNaN(t)) return null;
  const now = new Date(); return (t.getFullYear() - now.getFullYear()) * 12 + (t.getMonth() - now.getMonth()) + (t.getDate() >= now.getDate() ? 0 : -1);
}
function companyName(id) { const c = S.companies.find(c => c.id === id); return c ? c.name : ""; }

/* ---------- Calculs ---------- */
function monthTotals(key) {
  let inc = 0, exp = 0;
  for (const t of S.transactions) if (monthKey(t.date) === key) { const a = n(t.amount); if (a >= 0) inc += a; else exp += -a; }
  return { inc, exp, net: inc - exp };
}
function lastMonths(k) {
  const out = [], d = new Date(); d.setDate(1);
  for (let i = k - 1; i >= 0; i--) { const x = new Date(d.getFullYear(), d.getMonth() - i, 1); out.push(x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0")); }
  return out;
}
function goalInfo(g) {
  const target = n(g.target), cur = n(g.current), pct = target > 0 ? Math.min(100, cur / target * 100) : 0;
  const m = monthsUntil(g.deadline), left = Math.max(0, target - cur);
  return { target, cur, pct, left, months: m, perMonth: left > 0 && m !== null ? left / Math.max(1, m) : 0, late: m !== null && m < 0 && left > 0, done: left <= 0 && target > 0 };
}
function totalBalance() { return S.transactions.reduce((s, t) => s + n(t.amount), 0); }

/* ---------- Rendu ---------- */
function renderNav() {
  const navView = view === "entreprise" ? "entreprises" : view;
  $("#nav").innerHTML = SECTIONS.map(s => `<button type="button" data-view="${s.id}" ${s.id === navView ? 'aria-current="page"' : ""}>${esc(s.label)}${s.col ? `<span class="count">${S[s.col].length}</span>` : ""}</button>`).join("");
}
function render() {
  renderNav();
  const fab = $("#fab"); if (fab) fab.hidden = view === "jarvis";
  updateConvoUi();
  $("#currency").value = S.settings.currency || "EUR";
  const m = $("#main");
  const keepScroll = view === "jarvis" ? null : window.scrollY;
  let html = "";
  if (offline) html += `<div class="notice">Les données ne sont pas disponibles dans cet aperçu. Ouvre la page sur claude.ai en étant connecté pour enregistrer tes objectifs et parler à Jarvis.</div>`;
  if (view === "entreprise" && !S.companies.some(c => c.id === currentCompany)) view = S.loaded.companies ? "entreprises" : view;
  html += ({ accueil: vHome, objectifs: vGoals, projets: vProjects, entreprises: vCompanies, entreprise: vCompany, clients: vClients, finances: vFinances, jarvis: vJarvis })[view]();
  if (view === "jarvis" && m.querySelector("#chatInput")) { updateChat(); updateConvoUi(); return; }
  m.innerHTML = html;
  updateConvoUi();
  if (view === "jarvis") { updateChat(); $("#chatInput")?.focus(); }
  if (keepScroll != null) window.scrollTo(0, keepScroll);
}
function emptyState(text, type) {
  return `<div class="empty">${esc(text)}${type ? `<div><button type="button" class="btn small" data-new="${type}">Ajouter</button></div>` : ""}</div>`;
}
function head(title, sub, btn) {
  return `<div class="head"><div><div class="eyebrow">${esc(new Date().toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" }))}</div><h2>${esc(title)}</h2>${sub ? `<p>${esc(sub)}</p>` : ""}</div>${btn || ""}</div>`;
}

function goalHtml(g) {
  const i = goalInfo(g);
  return `<div class="goal" data-edit="goals" data-id="${esc(g.id)}" tabindex="0" role="button">
    <div class="goal-top"><span class="goal-title">${esc(g.title)}</span><span class="num">${money(i.cur, true)} / ${money(i.target, true)}</span></div>
    <div class="bar" role="progressbar" aria-valuenow="${Math.round(i.pct)}" aria-valuemin="0" aria-valuemax="100"><i class="${i.done ? "done" : ""}" style="width:${i.pct.toFixed(1)}%"></i></div>
    <div class="goal-meta">
      <span class="num">${Math.round(i.pct)} %</span>
      ${g.deadline ? `<span>Échéance ${esc(fmtDate(g.deadline))}</span>` : ""}
      ${i.done ? `<span class="chip termine">Atteint</span>` : i.late ? `<span class="chip late">Échéance dépassée</span>` : i.perMonth ? `<span>À mettre de côté : <b class="num">${money(i.perMonth, true)}</b>/mois</span>` : ""}
      ${g.category ? `<span>${esc(g.category)}</span>` : ""}
    </div></div>`;
}

function vHome() {
  const cur = monthTotals(lastMonths(1)[0]);
  const prev = monthTotals(lastMonths(2)[0]);
  const tTarget = S.goals.reduce((s, g) => s + n(g.target), 0), tCur = S.goals.reduce((s, g) => s + Math.min(n(g.current), n(g.target)), 0);
  const active = S.projects.filter(p => p.status === "en_cours");
  const goals = [...S.goals].filter(g => !goalInfo(g).done).sort((a, b) => (a.deadline || "9999").localeCompare(b.deadline || "9999")).slice(0, 4);
  const hour = new Date().getHours();
  const hello = hour < 5 ? "Bonne nuit" : hour < 18 ? "Bonjour" : "Bonsoir";
  return head(hello + (S.settings.name ? ", " + S.settings.name : ""), "Voici où en sont tes objectifs, tes projets et ton argent.", `<button type="button" class="btn primary start" data-convo aria-pressed="false">Démarrer Jarvis</button>`) + `
  <div class="kpis">
    <div class="kpi"><span class="eyebrow">Résultat du mois</span><span class="val num ${cur.net >= 0 ? "pos" : "neg"}">${money(cur.net, true)}</span><span class="sub">Mois dernier : <span class="num">${money(prev.net, true)}</span></span></div>
    <div class="kpi"><span class="eyebrow">Revenus du mois</span><span class="val num">${money(cur.inc, true)}</span><span class="sub">Dépenses : <span class="num">${money(cur.exp, true)}</span></span></div>
    <div class="kpi"><span class="eyebrow">Objectifs financés</span><span class="val num">${tTarget ? Math.round(tCur / tTarget * 100) : 0} %</span><span class="sub"><span class="num">${money(tCur, true)}</span> sur <span class="num">${money(tTarget, true)}</span></span></div>
    <div class="kpi"><span class="eyebrow">Projets en cours</span><span class="val num">${active.length}</span><span class="sub">${S.companies.filter(c => c.status === "active").length} entreprise(s) active(s), ${S.companies.filter(c => c.status !== "active").length} en projet</span></div>
  </div>
  <div class="grid2">
    <div class="stack">
      <section class="panel"><h3>Flux de trésorerie, 6 derniers mois <span class="legend"><span style="--c:var(--good)">Revenus</span><span style="--c:var(--bad)">Dépenses</span></span></h3><div class="chart">${cashChart()}</div></section>
      <section class="panel"><h3>Objectifs prioritaires <button type="button" class="btn small" data-new="goals">+ Objectif</button></h3>
        ${goals.length ? goals.map(goalHtml).join("") : emptyState("Aucun objectif en cours. Fixe un montant et une date, Jarvis calcule combien mettre de côté chaque mois.")}</section>
    </div>
    <div class="stack">
      <section class="panel"><h3>Briefing de Jarvis <button type="button" class="btn small" id="briefBtn" ${sample && !busy ? "" : "disabled"}>${briefing ? "Actualiser" : "Générer"}</button></h3>
        <div class="brief" id="brief">${briefing ? esc(briefing) : `<span class="empty">${sample ? "Demande à Jarvis un résumé de ta situation et les 3 actions prioritaires du jour." : "Jarvis sera disponible une fois la page ouverte sur claude.ai."}</span>`}</div>
        <form class="quick" id="quickAsk"><input id="quickInput" placeholder="Pose une question à Jarvis…" aria-label="Question pour Jarvis" autocomplete="off"><button class="btn" type="submit">Envoyer</button></form>
      </section>
      <section class="panel"><h3>Relances clients <button type="button" class="btn small" data-view="clients">Tous les clients</button></h3>
        <div class="list">${followUps().length ? followUps().slice(0, 6).map(clientRow).join("") : emptyState("Aucune relance prévue. Ajoute tes clients potentiels avec une date de prochaine action.", "clients")}</div>
      </section>
      <section class="panel"><h3>Projets en cours <button type="button" class="btn small" data-view="projets">Tout voir</button></h3>
        <div class="list">${active.length ? active.slice(0, 6).map(p => `<div class="row" data-edit="projects" data-id="${esc(p.id)}" tabindex="0" role="button"><div class="main"><strong>${esc(p.name)}</strong><small>${esc(p.nextStep ? "Prochaine étape : " + p.nextStep : companyName(p.company) || "")}</small></div><span class="chip en_cours">En cours</span></div>`).join("") : emptyState("Aucun projet en cours.", "projects")}</div>
      </section>
    </div>
  </div>`;
}

function cashChart() {
  const ms = lastMonths(6), data = ms.map(monthTotals);
  const max = Math.max(1, ...data.map(d => Math.max(d.inc, d.exp)));
  const W = 560, H = 200, L = 52, B = 22, T = 10, cw = (W - L) / ms.length, bw = Math.min(22, cw / 3.2);
  const y = v => T + (H - T - B) * (1 - v / max);
  const ticks = [0, max / 2, max];
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Revenus et dépenses par mois">`;
  for (const t of ticks) s += `<line x1="${L}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(t) + 3}" text-anchor="end">${esc(money(t, true))}</text>`;
  data.forEach((d, i) => {
    const cx = L + cw * i + cw / 2;
    s += `<rect x="${cx - bw - 1}" y="${y(d.inc)}" width="${bw}" height="${Math.max(0, H - B - y(d.inc))}" rx="2" fill="var(--good)"><title>Revenus ${money(d.inc)}</title></rect>`;
    s += `<rect x="${cx + 1}" y="${y(d.exp)}" width="${bw}" height="${Math.max(0, H - B - y(d.exp))}" rx="2" fill="var(--bad)"><title>Dépenses ${money(d.exp)}</title></rect>`;
    const lab = new Date(ms[i] + "-15").toLocaleDateString("fr-FR", { month: "short" });
    s += `<text x="${cx}" y="${H - 6}" text-anchor="middle">${esc(lab)}</text>`;
  });
  return s + `</svg>`;
}

function vGoals() {
  const open = S.goals.filter(g => !goalInfo(g).done), done = S.goals.filter(g => goalInfo(g).done);
  const perMonth = open.reduce((s, g) => s + goalInfo(g).perMonth, 0);
  return head("Objectifs", perMonth ? `Pour tout atteindre à temps : ${money(perMonth, true)} à mettre de côté par mois.` : "Fixe un montant cible et une échéance pour chaque objectif.", `<button type="button" class="btn primary" data-new="goals">+ Nouvel objectif</button>`) +
    `<div class="grid2"><section class="panel"><h3>En cours (${open.length})</h3>${open.length ? open.map(goalHtml).join("") : emptyState("Aucun objectif en cours.", "goals")}</section>
     <section class="panel"><h3>Atteints (${done.length})</h3>${done.length ? done.map(goalHtml).join("") : emptyState("Tes objectifs atteints apparaîtront ici.")}</section></div>`;
}

function vProjects() {
  const cols = Object.entries(PROJECT_STATUS).map(([k, label]) => {
    const items = S.projects.filter(p => (p.status || "idee") === k);
    return `<div class="col"><h4>${esc(label)} <span class="num">${items.length}</span></h4>${items.map(p => `<div class="card" data-edit="projects" data-id="${esc(p.id)}" tabindex="0" role="button"><strong>${esc(p.name)}</strong>${companyName(p.company) ? `<small>${esc(companyName(p.company))}</small>` : ""}${p.nextStep ? `<small>→ ${esc(p.nextStep)}</small>` : ""}${n(p.budget) ? `<small class="num">Budget ${money(p.budget, true)}</small>` : ""}</div>`).join("")}</div>`;
  }).join("");
  return head("Projets", "De l'idée à la réalisation. Clique sur un projet pour le modifier.", `<button type="button" class="btn primary" data-new="projects">+ Nouveau projet</button>`) + `<div class="board">${cols}</div>`;
}

function vCompanies() {
  const card = c => {
    const tx = S.transactions.filter(t => t.company === c.id);
    const inc = tx.filter(t => n(t.amount) > 0).reduce((s, t) => s + n(t.amount), 0), exp = tx.filter(t => n(t.amount) < 0).reduce((s, t) => s - n(t.amount), 0);
    const pr = S.projects.filter(p => p.company === c.id);
    const open = S.clients.filter(x => x.company === c.id && OPEN_STAGES.includes(x.stage || "prospect")).length;
    return `<div class="company" data-company="${esc(c.id)}" tabindex="0" role="button" aria-label="Ouvrir la fiche ${esc(c.name)}">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><h4>${esc(c.name)}</h4><span class="chip ${c.status === "active" ? "active" : "projet"}">${esc(COMPANY_STATUS[c.status] || "Future / en projet")}</span></div>
      ${c.sector ? `<small style="color:var(--muted)">${esc(c.sector)}</small>` : ""}
      <dl><dt>CA mensuel visé</dt><dd class="num">${n(c.monthlyRevenue) ? money(c.monthlyRevenue, true) : "—"}</dd>
      <dt>Revenus enregistrés</dt><dd class="num">${money(inc, true)}</dd><dt>Dépenses enregistrées</dt><dd class="num">${money(exp, true)}</dd><dt>Projets</dt><dd class="num">${pr.length}</dd><dt>Clients potentiels</dt><dd class="num">${open}</dd></dl>
      ${c.notes ? `<small style="color:var(--muted);overflow-wrap:anywhere">${esc(c.notes)}</small>` : ""}</div>`;
  };
  const act = S.companies.filter(c => c.status === "active"), fut = S.companies.filter(c => c.status !== "active");
  return head("Entreprises", "Tes entreprises actuelles et celles que tu prépares. Ouvre une entreprise pour voir son tableau de bord.", `<button type="button" class="btn primary" data-new="companies">+ Nouvelle entreprise</button>`) +

function readForm() {

const SYSTEM = `Tu es Jarvis, l'assistant personnel de l'utilisateur pour ses objectifs financiers, ses projets et ses entreprises (actuelles et futures).

Tu peux agir sur son tableau de bord grâce aux outils : quand il te donne une info (dépense, revenu, objectif, idée de projet, entreprise), enregistre-la avec l'outil adapté, puis confirme en une phrase. Pour modifier un élément, utilise son id tel qu'il figure dans les données. Ne supprime rien sans demande explicite.

function buildMessages(history, question) {
  const voiceNote = voiceOn ? "\n\nMODE VOCAL ACTIF : ta réponse sera lue à voix haute. Réponds en 2 à 4 phrases courtes et naturelles, sans listes ni symboles, comme le Jarvis d'Iron Man : posé, efficace, avec une pointe d'humour." : "";
  const ctx = `${SYSTEM}${voiceNote}\n\nDONNÉES ACTUELLES DU TABLEAU DE BORD (JSON) :\n${JSON.stringify(snapshotForAI())}`;
  const msgs = [{ role: "user", content: ctx }, { role: "assistant", content: "Compris. Je suis prêt." }];
  for (const m of history) {
    if (m.role !== "user" && m.role !== "assistant") continue;
    const last = msgs[msgs.length - 1];
    if (last.role === m.role) last.content += "\n\n" + m.content; else msgs.push({ role: m.role, content: m.content });
  }
  if (question) { const last = msgs[msgs.length - 1]; if (last.role === "user") last.content += "\n\n" + question; else msgs.push({ role: "user", content: question }); }
  return msgs;
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

/* Voix masculines françaises, de la plus naturelle à la plus basique (Edge, macOS/iOS, Windows, Android) */
const MALE_RANK = [/henri/i, /r[ée]my/i, /thomas/i, /daniel/i, /nicolas/i, /antoine/i, /jean|mathieu|guillaume|alain|fabrice|jerome|jérôme|olivier/i, /paul/i, /claude/i, /x-frd|x-frb|x-cad/i, /\bmale\b|homme|masculin/i];
const FEMALE = /am[ée]lie|audrey|aur[ée]lie|marie|virginie|julie|denise|[ée]loise|vivienne|sylvie|hortense|c[ée]line|chantal|josephine|brigitte|coralie|jacqueline|yvette|x-fra|x-frc|female|femme|google/i;
let voicePref = "";

function frVoices() { try { return speechSynthesis.getVoices().filter(v => /^fr/i.test(v.lang)); } catch (e) { return []; } }
function isMale(v) { return !!v && !FEMALE.test(v.name + " " + v.voiceURI) && MALE_RANK.some(r => r.test(v.name + " " + v.voiceURI)); }
function rankMale(v) { const s = v.name + " " + v.voiceURI; const i = MALE_RANK.findIndex(r => r.test(s)); return (i < 0 ? 99 : i) - (/natural|online|enhanced|premium|neural/i.test(s) ? .5 : 0) + (/^fr-fr/i.test(v.lang) ? 0 : .2); }
function frVoice() {
  const vs = frVoices(); if (!vs.length) return null;
  if (voicePref) { const p = vs.find(v => v.name === voicePref); if (p) return p; }
  const males = vs.filter(isMale).sort((a, b) => rankMale(a) - rankMale(b));
  return males[0] || vs[0];
}
function voiceOptions() {
  const vs = frVoices(), cur = frVoice();
  if (!vs.length) return `<option value="">Voix par défaut</option>`;
  const males = vs.filter(isMale).sort((a, b) => rankMale(a) - rankMale(b)), others = vs.filter(v => !isMale(v));
  const opt = v => `<option value="${esc(v.name)}" ${cur && v.name === cur.name ? "selected" : ""}>${esc(v.name.replace(/Microsoft |Online \(Natural\) |- French \((France|Canada|Belgium|Switzerland)\)/g, "").trim())}</option>`;
  return (males.length ? `<optgroup label="Voix d'homme">${males.map(opt).join("")}</optgroup>` : "") + (others.length ? `<optgroup label="Autres voix">${others.map(opt).join("")}</optgroup>` : "");

function speak(text, done) {

  if (!voiceOn || !("speechSynthesis" in window) || !text) { setTimeout(finish, 0); return; }
  try {
    speechSynthesis.cancel();

let convo = false;

  } finally { busy = false; pending = null; if (orbState === "thinking") setOrb(""); render(); }
}

async function makeBriefing() {
  if (!sample || busy) return;
  busy = true; const box = $("#brief"); const btn = $("#briefBtn"); if (btn) btn.disabled = true;
  if (box) box.textContent = "Jarvis analyse ta situation…";
  try {
    const res = await sample(buildMessages([], "Fais-moi mon briefing du jour en 120 mots maximum : 1) où j'en suis financièrement ce mois-ci, 2) l'objectif qui demande le plus d'attention, 3) trois actions concrètes pour aujourd'hui. Si les données sont vides, explique comment démarrer."), { modelTier: "quick", onText: u => { briefing = u.text; const b = $("#brief"); if (b) b.textContent = u.text; } });
    briefing = res.text.trim();
    speak(briefing);
  } catch (e) { briefing = e && e.code === "not_granted" ? "Autorise Jarvis à utiliser Claude pour obtenir ton briefing." : "Le briefing n'a pas pu être généré. Réessaie dans un instant."; }
  finally { busy = false; render(); }
}

/* ---------- Événements ---------- */
function go(v) { view = v; try { history.replaceState(null, "", "#" + v); } catch (e) {} render(); window.scrollTo(0, 0); }
document.addEventListener("click", e => {
  const t = e.target.closest("[data-convo],[data-view],[data-new],[data-edit],[data-suggest],[data-company],[data-advance],[data-plan],#briefBtn,#clearChat,#micBtn,#orb,#voiceTest");
  if (!t) return;
  if (t.hasAttribute("data-convo")) { if (convo) stopConvo(false); else startConvo(); }
  else if (t.dataset.advance) advance(t.dataset.advance);
  else if (t.dataset.plan) makePlan(t.dataset.plan);
  else if (t.dataset.company) { currentCompany = t.dataset.company; go("entreprise"); }
  else if (t.id === "micBtn") listen();
  else if (t.id === "voiceTest") { voiceOn = true; try { localStorage.setItem("jarvis-voice", "1"); } catch (_) {} const vt = $("#voiceToggle"); if (vt) vt.checked = true; speak("Bonsoir. Ici Jarvis. Tous les systèmes sont opérationnels."); }
  else if (t.id === "orb") stopSpeaking();
  else if (t.dataset.view) go(t.dataset.view);
  else if (t.dataset.new) openForm(t.dataset.new);
  else if (t.dataset.edit) openForm(t.dataset.edit, t.dataset.id);
  else if (t.dataset.suggest) send(t.dataset.suggest);
  else if (t.id === "briefBtn") makeBriefing();
  else if (t.id === "clearChat") clearChat(t);
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-edit][tabindex]")) { e.preventDefault(); openForm(e.target.dataset.edit, e.target.dataset.id); }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-company][tabindex]")) { e.preventDefault(); currentCompany = e.target.dataset.company; go("entreprise"); }
  if (e.key === "Enter" && !e.shiftKey && e.target.id === "chatInput") { e.preventDefault(); $("#composer").requestSubmit(); }
});
document.addEventListener("submit", e => {
  if (e.target.id === "composer") { e.preventDefault(); const i = $("#chatInput"); const v = i.value; i.value = ""; send(v); }
  if (e.target.id === "quickAsk") { e.preventDefault(); const v = $("#quickInput").value; send(v); }
});
document.addEventListener("change", e => {
  if (e.target.id === "finMonth") { finMonth = e.target.value; render(); }
  if (e.target.id === "voiceSel") { voicePref = e.target.value; try { localStorage.setItem("jarvis-voice-name", voicePref); } catch (_) {} voiceOn = true; try { localStorage.setItem("jarvis-voice", "1"); } catch (_) {} const vt = $("#voiceToggle"); if (vt) vt.checked = true; speak("Voix sélectionnée. Je suis prêt."); }
  if (e.target.id === "clientFilter") { clientFilter = e.target.value; render(); }
  if (e.target.id === "voiceToggle") { voiceOn = e.target.checked; try { localStorage.setItem("jarvis-voice", voiceOn ? "1" : "0"); } catch (_) {} if (voiceOn) speak("Mode vocal activé. À votre service."); else stopSpeaking(); }
  if (e.target.id === "currency" && db) db.doc("settings/main").set({ ...S.settings, currency: e.target.value }).catch(toastErr);
});
async function advance(id) {
  const x = S.clients.find(c => c.id === id); if (!x || !db) return;
  const i = STAGE_ORDER.indexOf(stageOf(x)), next = STAGE_ORDER[i + 1];
  if (!next || !OPEN_STAGES.includes(stageOf(x))) return;
  try { await db.doc("clients/" + id).update({ stage: next, ...(next === "gagne" ? { wonDate: today() } : {}) }); } catch (err) { toastErr(err); }
}
let clearArmed = false;
async function clearChat(btn) {
  if (!db || !S.chat.length) return;
  if (!clearArmed) { clearArmed = true; btn.textContent = "Confirmer l'effacement"; setTimeout(() => { clearArmed = false; if (btn.isConnected) btn.textContent = "Effacer la conversation"; }, 4000); return; }
  clearArmed = false;
  for (const m of [...S.chat]) { try { await db.doc("chat/" + m.id).delete(); } catch (e) {} }
}

/* ---------- Effets HUD ---------- */
function reactor() {
  let seg = "";
  for (let i = 0; i < 10; i++) seg += `<rect x="47" y="21" width="6" height="9" rx="1" transform="rotate(${i * 36} 50 50)"/>`;
  return `<svg class="reactor" viewBox="0 0 100 100" aria-hidden="true"><circle class="r-out" cx="50" cy="50" r="47"/><circle class="r-dash" cx="50" cy="50" r="41"/><circle class="r-arc" cx="50" cy="50" r="35"/><g class="r-seg">${seg}</g><circle class="r-ring" cx="50" cy="50" r="19"/><circle class="r-core" cx="50" cy="50" r="12"/></svg>`;
}
document.querySelectorAll(".reactor-slot").forEach(s => { s.outerHTML = reactor(); });
function tick() { const c = $("#clock"); if (c) c.textContent = new Date().toLocaleTimeString("fr-FR"); }
tick(); setInterval(tick, 1000);
(function hud() {
  const cv = $("#hud"); if (!cv || !cv.getContext) return;
  const ctx = cv.getContext("2d");
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const P = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random(), v: .0002 + Math.random() * .0007, r: Math.random() * 1.5 + .4 }));
  let w = 0, h = 0, dpr = 1, t = 0;
  function size() { dpr = Math.min(2, window.devicePixelRatio || 1); w = cv.width = innerWidth * dpr; h = cv.height = innerHeight * dpr; }
  size(); addEventListener("resize", size);
  function frame() {
    t++;
    ctx.clearRect(0, 0, w, h);
    const cx = w * .84, cy = h * .8, R = Math.min(w, h) * .34;
    ctx.lineWidth = dpr;
    for (let k = 0; k < 5; k++) {
      const a = t * .0016 * (k % 2 ? 1 : -1) * (1 + k * .4);
      ctx.strokeStyle = `rgba(58,214,255,${.05 + k * .012})`;
      ctx.setLineDash(k % 2 ? [3 * dpr, 9 * dpr] : [50 * dpr, 24 * dpr, 8 * dpr, 24 * dpr]);
      ctx.beginPath(); ctx.arc(cx, cy, R * (.35 + k * .17), a, a + Math.PI * (1.2 + k * .15)); ctx.stroke();
    }
    ctx.setLineDash([]);
    const sy = (t * 1.2 * dpr) % (h + 200) - 100;
    const g = ctx.createLinearGradient(0, sy - 60, 0, sy);
    g.addColorStop(0, "rgba(58,214,255,0)"); g.addColorStop(1, "rgba(58,214,255,0.035)");
    ctx.fillStyle = g; ctx.fillRect(0, sy - 60, w, 60);
    for (const p of P) {
      if (!reduce) { p.y -= p.v; if (p.y < 0) { p.y = 1; p.x = Math.random(); } }
      ctx.fillStyle = "rgba(58,214,255,0.4)"; ctx.beginPath(); ctx.arc(p.x * w, p.y * h, p.r * dpr, 0, 7); ctx.fill();
    }
    if (!reduce) requestAnimationFrame(frame);
  }
  frame();
})();
function beep(f = 880, d = .06) {
  if (!voiceOn) return;
  try { const A = window.AudioContext || window.webkitAudioContext; beep.ctx = beep.ctx || new A(); const c = beep.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = "sine"; o.frequency.value = f; g.gain.setValueAtTime(.05, c.currentTime); g.gain.exponentialRampToValueAtTime(.0001, c.currentTime + d);
    o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime + d); } catch (e) {}
}

/* ---------- Démarrage ---------- */
render();
(async () => {
  const c = window.claude;
  if (!c || !c.use) { offline = true; $("#status").textContent = "Aperçu hors ligne"; render(); return; }
  db = await c.use("db");
  if (!db) { offline = true; $("#status").textContent = "Données indisponibles"; render(); return; }
  $("#status").textContent = "Synchronisé";
  for (const col of COLS) db.collection(col).onSnapshot(snap => { S[col] = snap.docs.map(d => ({ id: d.id, ...d.data() })); S.loaded[col] = true; render(); }, () => { $("#status").textContent = "Erreur de synchronisation"; });
  db.collection("chat").orderBy("ts", "desc").limit(80).onSnapshot(snap => { S.chat = snap.docs.map(d => ({ id: d.id, ...d.data() })).reverse(); if (view === "jarvis") updateChat(); });
  db.doc("settings/main").onSnapshot(snap => { if (snap.exists) S.settings = { currency: "EUR", ...snap.data() }; render(); });
  sample = await c.use("sample");
  render();
})();
</script>
