<title>Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: poste de pilotage — rail de navigation à gauche, panneau de travail à droite, une colonne sur téléphone */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --sunken: #e3e8ee;
  --line: #d3dae2;
  --ink: #15212c;
  --muted: #5b6875;
  --accent: #1f4fd1;
  --accent-soft: #dfe7fb;
  --gold: #a86f00;
  --good: #1b7a4a;
  --good-soft: #dcf0e4;
  --warn: #9a5b00;
  --warn-soft: #f7ead3;
  --bad: #b3261e;
  --bad-soft: #f8dedc;
  --font-display: "Unbounded", "Manrope", system-ui, sans-serif;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151c; --surface: #161e27; --sunken: #1d2732; --line: #2a3643;
    --ink: #e6ecf2; --muted: #93a1af; --accent: #7d9cff; --accent-soft: #1e2b4d;
    --gold: #e0a93a; --good: #5ccb8e; --good-soft: #15342a; --warn: #e8a64a; --warn-soft: #3a2c14;
    --bad: #f08a80; --bad-soft: #3d1d1b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151c; --surface: #161e27; --sunken: #1d2732; --line: #2a3643;
  --ink: #e6ecf2; --muted: #93a1af; --accent: #7d9cff; --accent-soft: #1e2b4d;
  --gold: #e0a93a; --good: #5ccb8e; --good-soft: #15342a; --warn: #e8a64a; --warn-soft: #3a2c14;
  --bad: #f08a80; --bad-soft: #3d1d1b; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }

.app { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100%; }
.rail { background: var(--surface); border-right: 1px solid var(--line); padding: 24px 14px; display: flex; flex-direction: column; gap: 24px; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; }
.brand { display: flex; align-items: center; gap: 10px; padding-inline: 8px; }
.brand-mark { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--accent); display: grid; place-items: center; }
.brand-mark span { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.brand h1 { font-family: var(--font-display); font-size: 17px; letter-spacing: .04em; margin: 0; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { all: unset; cursor: pointer; padding: 9px 12px; border-radius: 8px; color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
.nav button:hover { background: var(--sunken); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav button:focus-visible { outline: 2px solid var(--accent); }
.nav .count { font-family: var(--font-data); font-size: 12px; }
.rail-foot { margin-top: auto; font-size: 12px; color: var(--muted); padding-inline: 8px; display: flex; flex-direction: column; gap: 6px; }
.rail-foot select { background: var(--sunken); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }

main { padding-block: 28px 48px; padding-inline: 32px; min-width: 0; max-width: 1200px; width: 100%; }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
.head h2 { font-family: var(--font-display); font-weight: 500; font-size: 26px; margin: 0; text-wrap: balance; }
.head p { margin: 4px 0 0; color: var(--muted); }
.eyebrow { text-transform: uppercase; letter-spacing: .08em; font-size: 11px; font-weight: 700; color: var(--muted); }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.danger { color: var(--bad); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.kpi .val { font-family: var(--font-data); font-size: 22px; font-weight: 600; }
.kpi .sub { font-size: 12px; color: var(--muted); }
.pos { color: var(--good); } .neg { color: var(--bad); }

.grid2 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.panel h3 { margin: 0; font-size: 15px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.stack { display: flex; flex-direction: column; gap: 16px; }

.goal { display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; }
.goal:first-of-type { border-top: 0; }
.goal-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.goal-title { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.bar { height: 8px; background: var(--sunken); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.bar i.done { background: var(--good); }
.goal-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }

.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--sunken); color: var(--muted); white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.en_cours, .chip.active { background: var(--accent-soft); color: var(--accent); }
.chip.termine { background: var(--good-soft); color: var(--good); }
.chip.pause, .chip.late { background: var(--warn-soft); color: var(--warn); }
.chip.idee, .chip.projet { background: var(--sunken); color: var(--muted); }

.list { display: flex; flex-direction: column; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; }
.row:first-child { border-top: 0; }
.row .main { min-width: 0; display: flex; flex-direction: column; }
.row .main strong { overflow-wrap: anywhere; }
.row .main small { color: var(--muted); overflow-wrap: anywhere; }

.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.col { background: var(--sunken); border-radius: var(--radius); padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.col h4 { margin: 2px 4px 4px; font-size: 13px; display: flex; justify-content: space-between; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
.card:hover, .row:hover .main strong, .goal:hover .goal-title { color: var(--accent); }
.card small { color: var(--muted); overflow-wrap: anywhere; }

.companies { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.company { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; }
.company h4 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 16px; overflow-wrap: anywhere; }
.company dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 13px; }
.company dt { color: var(--muted); } .company dd { margin: 0; text-align: right; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); }
tbody tr { cursor: pointer; } tbody tr:hover { background: var(--sunken); }
td.amt, th.amt { text-align: right; }

.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-family: var(--font-data); font-size: 10px; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; background: var(--c); }

.empty { color: var(--muted); font-size: 14px; padding: 8px 0; }
.empty button { margin-top: 8px; }
.notice { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 10px 14px; font-size: 14px; margin-bottom: 16px; }

/* Chat */
.chat { display: flex; flex-direction: column; height: calc(100vh - 150px); min-height: 420px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.msgs { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 75ch; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.user { align-self: flex-end; background: var(--accent); color: var(--surface); border-bottom-right-radius: 4px; }
.msg.assistant { align-self: flex-start; background: var(--sunken); border-bottom-left-radius: 4px; }
.msg.tool { align-self: flex-start; font-size: 12px; color: var(--muted); padding: 2px 4px; font-family: var(--font-data); }
.composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
.composer textarea { flex: 1; resize: none; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 9px 12px; min-height: 44px; max-height: 140px; }
.suggest { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 12px; }
.suggest button { border: 1px solid var(--line); background: transparent; border-radius: 99px; padding: 4px 12px; font-size: 13px; cursor: pointer; color: var(--muted); }
.suggest button:hover { color: var(--accent); border-color: var(--accent); }
.quick { display: flex; gap: 8px; }
.quick input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 12px; }
.brief { white-space: pre-wrap; font-size: 14px; }

/* Form dialog */
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); padding: 0; width: min(480px, calc(100vw - 32px)); }
dialog::backdrop { background: rgb(10 16 24 / .45); }
dialog form { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
dialog h3 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 18px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 12px; font-weight: 700; color: var(--muted); }
.field input, .field select, .field textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; width: 100%; }
.field .hint { font-size: 12px; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 4px; }
.actions .spacer { flex: 1; }

/* Fiche entreprise & pipeline */
.crumb { all: unset; cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 600; }
.crumb:hover { color: var(--accent); }
.pipe { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.pipe .col h4 small { color: var(--muted); font-weight: 500; }
.card .card-foot { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: 2px; }
.adv { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 1px 8px; font-size: 12px; cursor: pointer; color: var(--muted); }
.adv:hover { color: var(--accent); border-color: var(--accent); }
.due { color: var(--warn); font-weight: 700; }
.services { display: flex; flex-wrap: wrap; gap: 6px; }
.services span { background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 3px 10px; font-size: 13px; font-weight: 600; }
.chip.prospect { background: var(--sunken); color: var(--muted); }
.chip.contacte { background: var(--accent-soft); color: var(--accent); }
.chip.devis { background: var(--warn-soft); color: var(--warn); }
.chip.gagne { background: var(--good-soft); color: var(--good); }
.chip.perdu { background: var(--bad-soft); color: var(--bad); }
.contact { font-family: var(--font-data); font-size: 12px; user-select: all; }

/* Orbe vocal de Jarvis */
.chat-top { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.orb { width: 44px; height: 44px; border-radius: 50%; position: relative; display: grid; place-items: center; flex: none; }
.orb::before, .orb::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--accent); opacity: .35; }
.orb::after { inset: 8px; opacity: .6; }
.orb i { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 5px var(--accent-soft); }
.orb-label { font-size: 13px; color: var(--muted); flex: 1; min-width: 140px; }
.mic { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: grid; place-items: center; flex: none; }
.mic svg { width: 20px; height: 20px; fill: var(--ink); }
.mic[aria-pressed="true"] { background: var(--bad); border-color: var(--bad); }
.mic[aria-pressed="true"] svg { fill: var(--surface); }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
@media (prefers-reduced-motion: no-preference) {
  .orb[data-state="speaking"]::before { animation: ring 1.1s ease-out infinite; }
  .orb[data-state="speaking"]::after { animation: ring 1.1s ease-out .35s infinite; }
  .orb[data-state="listening"] i { animation: beat .8s ease-in-out infinite alternate; background: var(--bad); }
  .orb[data-state="thinking"]::before { border-style: dashed; animation: spin 2s linear infinite; opacity: .7; }
}
@keyframes ring { from { transform: scale(.7); opacity: .8; } to { transform: scale(1.35); opacity: 0; } }
@keyframes beat { from { transform: scale(.8); } to { transform: scale(1.25); } }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 1000px) {
  .pipe { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 10px 16px; gap: 10px; border-right: 0; border-bottom: 1px solid var(--line); }
  .nav { flex-direction: row; overflow-x: auto; gap: 4px; width: 100%; order: 3; }
  .nav button { white-space: nowrap; padding: 6px 10px; }
  .nav .count { display: none; }
  .rail-foot { margin: 0 0 0 auto; flex-direction: row; align-items: center; }
  .rail-foot .who { display: none; }
  main { padding-inline: 16px; padding-block: 18px 40px; }
  .board, .pipe { grid-template-columns: minmax(0, 1fr); }
  .chat { height: calc(100vh - 200px); }
  .head h2 { font-size: 22px; }
}
@media (prefers-reduced-motion: no-preference) {
  .bar i { transition: width .4s ease; }
}
</style>

<div class="app">
  <aside class="rail">
    <div class="brand"><div class="brand-mark" aria-hidden="true"><span></span></div><h1>JARVIS</h1></div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="rail-foot">
      <label for="currency" class="eyebrow">Devise</label>
      <select id="currency">
        <option>EUR</option><option>TND</option><option>USD</option><option>CAD</option><option>CHF</option><option>MAD</option><option>GBP</option>
      </select>
      <span class="who" id="status">Connexion…</span>
    </div>
  </aside>
  <main id="main"></main>
</div>

<dialog id="dlg"><form id="dlgForm" method="dialog"></form></dialog>

<script>
const SECTIONS = [
  { id: "accueil", label: "Tableau de bord" },
  { id: "objectifs", label: "Objectifs", col: "goals" },
  { id: "projets", label: "Projets", col: "projects" },
  { id: "entreprises", label: "Entreprises", col: "companies" },
  { id: "clients", label: "Clients", col: "clients" },
  { id: "finances", label: "Finances", col: "transactions" },
  { id: "jarvis", label: "Parler à Jarvis" },
];
const PROJECT_STATUS = { idee: "Idée", en_cours: "En cours", pause: "En pause", termine: "Terminé" };
const COMPANY_STATUS = { active: "Active", projet: "Future / en projet" };
const STAGES = { prospect: "Prospect", contacte: "Contacté", devis: "Devis envoyé", gagne: "Client gagné", perdu: "Perdu" };
const STAGE_ORDER = Object.keys(STAGES);
const OPEN_STAGES = ["prospect", "contacte", "devis"];
const COLS = ["goals", "projects", "companies", "transactions", "clients"];

const S = { goals: [], projects: [], companies: [], transactions: [], clients: [], chat: [], settings: { currency: "EUR" }, loaded: {} };
let db = null, sample = null, ready = false, offline = false;
let view = "accueil";
let currentCompany = null;
let orbState = "";
let voiceOn = false;
try { voiceOn = localStorage.getItem("jarvis-voice") === "1"; } catch (e) {}
let pending = null; // réponse de Jarvis en cours d'écriture
let busy = false;
let briefing = "";

try { const h = (location.hash || "").slice(1); if (SECTIONS.some(s => s.id === h)) view = h; } catch (e) {}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const n = v => { const x = Number(v); return Number.isFinite(x) ? x : 0; };
function money(v, compact) {
  try {
    return new Intl.NumberFormat("fr-FR", { style: "currency", currency: S.settings.currency || "EUR", maximumFractionDigits: compact ? 0 : 2, notation: compact && Math.abs(v) >= 100000 ? "compact" : "standard" }).format(n(v));
  } catch (e) { return n(v).toFixed(2) + " " + S.settings.currency; }
}
const today = () => new Date().toISOString().slice(0, 10);
const monthKey = d => String(d || "").slice(0, 7);
function fmtDate(d) { if (!d) return ""; const x = new Date(d + "T12:00:00"); return isNaN(x) ? d : x.toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "numeric" }); }
function monthsUntil(d) {
  if (!d) return null; const t = new Date(d + "T12:00:00"); if (isNaN(t)) return null;
  const now = new Date(); return (t.getFullYear() - now.getFullYear()) * 12 + (t.getMonth() - now.getMonth()) + (t.getDate() >= now.getDate() ? 0 : -1);
}
function companyName(id) { const c = S.companies.find(c => c.id === id); return c ? c.name : ""; }

/* ---------- Calculs ---------- */
function monthTotals(key) {
  let inc = 0, exp = 0;
  for (const t of S.transactions) if (monthKey(t.date) === key) { const a = n(t.amount); if (a >= 0) inc += a; else exp += -a; }
  return { inc, exp, net: inc - exp };
}
function lastMonths(k) {
  const out = [], d = new Date(); d.setDate(1);
  for (let i = k - 1; i >= 0; i--) { const x = new Date(d.getFullYear(), d.getMonth() - i, 1); out.push(x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0")); }
  return out;
}
function goalInfo(g) {
  const target = n(g.target), cur = n(g.current), pct = target > 0 ? Math.min(100, cur / target * 100) : 0;
  const m = monthsUntil(g.deadline), left = Math.max(0, target - cur);
  return { target, cur, pct, left, months: m, perMonth: left > 0 && m !== null ? left / Math.max(1, m) : 0, late: m !== null && m < 0 && left > 0, done: left <= 0 && target > 0 };
}
function totalBalance() { return S.transactions.reduce((s, t) => s + n(t.amount), 0); }

/* ---------- Rendu ---------- */
function renderNav() {
  const navView = view === "entreprise" ? "entreprises" : view;
  $("#nav").innerHTML = SECTIONS.map(s => `<button type="button" data-view="${s.id}" ${s.id === navView ? 'aria-current="page"' : ""}>${esc(s.label)}${s.col ? `<span class="count">${S[s.col].length}</span>` : ""}</button>`).join("");
}
function render() {
  renderNav();
  $("#currency").value = S.settings.currency || "EUR";
  const m = $("#main");
  const keepScroll = view === "jarvis" ? null : window.scrollY;
  let html = "";
  if (offline) html += `<div class="notice">Les données ne sont pas disponibles dans cet aperçu. Ouvre la page sur claude.ai en étant connecté pour enregistrer tes objectifs et parler à Jarvis.</div>`;
  if (view === "entreprise" && !S.companies.some(c => c.id === currentCompany)) view = S.loaded.companies ? "entreprises" : view;
  html += ({ accueil: vHome, objectifs: vGoals, projets: vProjects, entreprises: vCompanies, entreprise: vCompany, clients: vClients, finances: vFinances, jarvis: vJarvis })[view]();

function cashChart() {
  const ms = lastMonths(6), data = ms.map(monthTotals);
  const max = Math.max(1, ...data.map(d => Math.max(d.inc, d.exp)));
  const W = 560, H = 200, L = 52, B = 22, T = 10, cw = (W - L) / ms.length, bw = Math.min(22, cw / 3.2);
  const y = v => T + (H - T - B) * (1 - v / max);
  const ticks = [0, max / 2, max];
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Revenus et dépenses par mois">`;
  for (const t of ticks) s += `<line x1="${L}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(t) + 3}" text-anchor="end">${esc(money(t, true))}</text>`;
  data.forEach((d, i) => {
    const cx = L + cw * i + cw / 2;
    s += `<rect x="${cx - bw - 1}" y="${y(d.inc)}" width="${bw}" height="${Math.max(0, H - B - y(d.inc))}" rx="2" fill="var(--good)"><title>Revenus ${money(d.inc)}</title></rect>`;
    s += `<rect x="${cx + 1}" y="${y(d.exp)}" width="${bw}" height="${Math.max(0, H - B - y(d.exp))}" rx="2" fill="var(--bad)"><title>Dépenses ${money(d.exp)}</title></rect>`;
    const lab = new Date(ms[i] + "-15").toLocaleDateString("fr-FR", { month: "short" });
    s += `<text x="${cx}" y="${H - 6}" text-anchor="middle">${esc(lab)}</text>`;
  });
  return s + `</svg>`;
}

const SYSTEM = `Tu es Jarvis, l'assistant personnel de l'utilisateur pour ses objectifs financiers, ses projets et ses entreprises (actuelles et futures).

Tu peux agir sur son tableau de bord grâce aux outils : quand il te donne une info (dépense, revenu, objectif, idée de projet, entreprise), enregistre-la avec l'outil adapté, puis confirme en une phrase. Pour modifier un élément, utilise son id tel qu'il figure dans les données. Ne supprime rien sans demande explicite.
Tu aides aussi à développer ses entreprises : suivi des clients potentiels (prospect → contacté → devis envoyé → client gagné / perdu), relances, prix, idées pour trouver des clients, fidélisation. Quand il parle d'un client potentiel, enregistre-le avec ajouter_client et propose une prochaine action datée.
Les montants sont dans la devise indiquée. Tu n'es pas un conseiller financier agréé : pour les décisions lourdes (fiscalité, juridique, gros investissements), propose de vérifier avec un professionnel.`;

function buildMessages(history, question) {
  const voiceNote = voiceOn ? "\n\nMODE VOCAL ACTIF : ta réponse sera lue à voix haute. Réponds en 2 à 4 phrases courtes et naturelles, sans listes ni symboles, comme le Jarvis d'Iron Man : posé, efficace, avec une pointe d'humour." : "";
  const ctx = `${SYSTEM}${voiceNote}\n\nDONNÉES ACTUELLES DU TABLEAU DE BORD (JSON) :\n${JSON.stringify(snapshotForAI())}`;
  const msgs = [{ role: "user", content: ctx }, { role: "assistant", content: "Compris. Je suis prêt." }];
  for (const m of history) {
    if (m.role !== "user" && m.role !== "assistant") continue;
    const last = msgs[msgs.length - 1];
    if (last.role === m.role) last.content += "\n\n" + m.content; else msgs.push({ role: m.role, content: m.content });
  }
  if (question) { const last = msgs[msgs.length - 1]; if (last.role === "user") last.content += "\n\n" + question; else msgs.push({ role: "user", content: question }); }
  return msgs;
}

let recog = null, micBlocked = false;
function orbText() {
  return orbState === "listening" ? "Je vous écoute…" : orbState === "thinking" ? "Analyse en cours…" : orbState === "speaking" ? "Jarvis parle… (touchez l'orbe pour l'arrêter)" : sample ? "À votre service. Appuyez sur le micro ou écrivez." : "Jarvis sera disponible une fois la page ouverte sur claude.ai.";
}
function setOrb(s) {
  orbState = s;
  const o = $("#orb"); if (o) o.dataset.state = s;
  const l = $("#orbLabel"); if (l) l.textContent = orbText();
  const m = $("#micBtn"); if (m) m.setAttribute("aria-pressed", s === "listening");
}
function speakable(t) { return String(t).replace(/[*#_`>•|]/g, "").replace(/^\s*[-–]\s*/gm, "").replace(/\n+/g, ". ").replace(/\.\s*\./g, ".").slice(0, 2000); }
function frVoice() {
  try { const vs = speechSynthesis.getVoices().filter(v => /^fr/i.test(v.lang)); return vs.find(v => /google|thomas|daniel|paul|henri|male|homme/i.test(v.name)) || vs[0] || null; } catch (e) { return null; }
}
function speak(text) {
  if (!voiceOn || !("speechSynthesis" in window) || !text) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(speakable(text));
    u.lang = "fr-FR"; u.rate = 1.03; u.pitch = 0.9;
    const v = frVoice(); if (v) u.voice = v;
    u.onstart = () => setOrb("speaking");
    u.onend = u.onerror = () => { if (orbState === "speaking") setOrb(""); };
    speechSynthesis.speak(u);
  } catch (e) {}
}
function stopSpeaking() { try { speechSynthesis.cancel(); } catch (e) {} if (orbState === "speaking") setOrb(""); }
function listen() {
  if (orbState === "listening" && recog) { try { recog.stop(); } catch (e) {} return; }
  stopSpeaking();
  if (!SR || micBlocked) { alertBox("Le micro n'est pas accessible dans cette page. Astuce : touche la zone de texte puis l'icône micro de ton clavier (dictée) pour parler à Jarvis, il te répondra à voix haute."); $("#chatInput")?.focus(); return; }
  if (!voiceOn) { voiceOn = true; try { localStorage.setItem("jarvis-voice", "1"); } catch (e) {} const t = $("#voiceToggle"); if (t) t.checked = true; }
  let heard = "";
  try {
    recog = new SR(); recog.lang = "fr-FR"; recog.interimResults = true; recog.continuous = false;
    recog.onresult = e => { heard = Array.from(e.results).map(r => r[0].transcript).join(""); const i = $("#chatInput"); if (i) i.value = heard; };
    recog.onerror = e => { if (e.error === "not-allowed" || e.error === "service-not-allowed" || e.error === "audio-capture") { micBlocked = true; alertBox("Le micro est bloqué ici. Utilise la dictée de ton clavier (icône micro) : Jarvis te répondra quand même à voix haute."); } };
    recog.onend = () => { recog = null; setOrb(""); const v = heard.trim(); if (v) { const i = $("#chatInput"); if (i) i.value = ""; send(v); } };
    recog.start(); setOrb("listening");
  } catch (e) { micBlocked = true; setOrb(""); alertBox("Le micro n'a pas pu démarrer. Utilise la dictée de ton clavier."); }
}

async function makePlan(id) {
  const c = S.companies.find(x => x.id === id); if (!c || !sample || busy) return;
  busy = true; setOrb("thinking");
  const btn = $("#planBtn"); if (btn) btn.disabled = true;
  const box = $("#plan"); if (box) box.textContent = "Jarvis étudie " + c.name + "…";
  let text = "";
  try {
    const res = await sample(buildMessages([], `Prépare un plan de développement concret pour l'entreprise « ${c.name} » (id ${c.id}) à partir de ses services, de ses clients potentiels, de ses chiffres et de son objectif de CA. Structure en texte simple (pas de Markdown) :
1. Diagnostic en 2 phrases.
2. Les 3 clients potentiels à traiter en priorité cette semaine et quoi leur dire.
3. 5 actions pour trouver de nouveaux clients adaptées à ce type d'activité et à un petit budget.
4. Un conseil sur les prix ou les offres (forfaits, abonnements, packs).
5. L'objectif chiffré pour les 30 prochains jours.
Maximum 250 mots.`), { modelTier: "complex", onText: u => { text = u.text; const b = $("#plan"); if (b) b.textContent = u.text; } });
    text = res.text.trim();
    await db.doc("companies/" + c.id).update({ plan: text, planDate: today() });
    speak("Votre plan pour " + c.name + " est prêt. " + text.split("\n").slice(0, 2).join(" "));
  } catch (e) { alertBox(e && e.code === "not_granted" ? "Autorise Jarvis à utiliser Claude pour générer le plan." : "Le plan n'a pas pu être généré. Réessaie dans un instant."); }
  finally { busy = false; if (orbState === "thinking") setOrb(""); render(); }
}

async function send(text) {
  text = String(text || "").trim();
  if (!text || busy || !sample || !db) return;
  stopSpeaking();
  busy = true; pending = { text: "", tools: [] }; setOrb("thinking");
  if (view !== "jarvis") go("jarvis"); else updateChat();
  try { await db.collection("chat").add({ role: "user", content: text, ts: Date.now() }); } catch (e) {}
  const history = S.chat.filter(m => m.role === "user" || m.role === "assistant").slice(-20);
  if (!history.length || history[history.length - 1].content !== text) history.push({ role: "user", content: text });
  const toolLog = [];
  const log = s => { toolLog.push(s); pending.tools.push(s); updateChat(); };
  try {
    const res = await sample(buildMessages(history), { tools: makeTools(log), cache: false, onText: u => { pending.text = u.text; updateChat(); } });
    const answer = (res.text || "").trim() || "C'est fait.";
    for (const t of toolLog) await db.collection("chat").add({ role: "tool", content: t, ts: Date.now() });
    await db.collection("chat").add({ role: "assistant", content: answer, ts: Date.now() + 1 });
    setOrb(""); speak(answer);
  } catch (e) {
    const msg = e && e.code === "not_granted" ? "Tu n'as pas autorisé Jarvis à utiliser Claude. Autorise-le depuis le menu Permissions de la page."
      : e && e.code === "rate_limited" ? "Trop de demandes d'un coup. Attends une minute et réessaie."
      : "Je n'ai pas pu répondre (" + ((e && e.message) || "erreur inconnue") + "). Réessaie.";
    try { await db.collection("chat").add({ role: "assistant", content: msg, ts: Date.now() }); } catch (_) {}
    if (e && e.code === "not_granted") sample = null;
  } finally { busy = false; pending = null; if (orbState === "thinking") setOrb(""); render(); }
}

async function makeBriefing() {
  if (!sample || busy) return;
  busy = true; const box = $("#brief"); const btn = $("#briefBtn"); if (btn) btn.disabled = true;
  if (box) box.textContent = "Jarvis analyse ta situation…";
  try {
    const res = await sample(buildMessages([], "Fais-moi mon briefing du jour en 120 mots maximum : 1) où j'en suis financièrement ce mois-ci, 2) l'objectif qui demande le plus d'attention, 3) trois actions concrètes pour aujourd'hui. Si les données sont vides, explique comment démarrer."), { modelTier: "quick", onText: u => { briefing = u.text; const b = $("#brief"); if (b) b.textContent = u.text; } });
    briefing = res.text.trim();
    speak(briefing);
  } catch (e) { briefing = e && e.code === "not_granted" ? "Autorise Jarvis à utiliser Claude pour obtenir ton briefing." : "Le briefing n'a pas pu être généré. Réessaie dans un instant."; }
  finally { busy = false; render(); }
}

/* ---------- Événements ---------- */
function go(v) { view = v; try { history.replaceState(null, "", "#" + v); } catch (e) {} render(); window.scrollTo(0, 0); }
document.addEventListener("click", e => {
  const t = e.target.closest("[data-view],[data-new],[data-edit],[data-suggest],[data-company],[data-advance],[data-plan],#briefBtn,#clearChat,#micBtn,#orb");
  if (!t) return;
  if (t.dataset.advance) advance(t.dataset.advance);
  else if (t.dataset.plan) makePlan(t.dataset.plan);
  else if (t.dataset.company) { currentCompany = t.dataset.company; go("entreprise"); }
  else if (t.id === "micBtn") listen();
  else if (t.id === "orb") stopSpeaking();
  else if (t.dataset.view) go(t.dataset.view);
  else if (t.dataset.new) openForm(t.dataset.new);
  else if (t.dataset.edit) openForm(t.dataset.edit, t.dataset.id);
  else if (t.dataset.suggest) send(t.dataset.suggest);
  else if (t.id === "briefBtn") makeBriefing();
  else if (t.id === "clearChat") clearChat(t);
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-edit][tabindex]")) { e.preventDefault(); openForm(e.target.dataset.edit, e.target.dataset.id); }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-company][tabindex]")) { e.preventDefault(); currentCompany = e.target.dataset.company; go("entreprise"); }
  if (e.key === "Enter" && !e.shiftKey && e.target.id === "chatInput") { e.preventDefault(); $("#composer").requestSubmit(); }
});
document.addEventListener("submit", e => {
  if (e.target.id === "composer") { e.preventDefault(); const i = $("#chatInput"); const v = i.value; i.value = ""; send(v); }
  if (e.target.id === "quickAsk") { e.preventDefault(); const v = $("#quickInput").value; send(v); }
});
document.addEventListener("change", e => {
  if (e.target.id === "finMonth") { finMonth = e.target.value; render(); }
  if (e.target.id === "clientFilter") { clientFilter = e.target.value; render(); }
  if (e.target.id === "voiceToggle") { voiceOn = e.target.checked; try { localStorage.setItem("jarvis-voice", voiceOn ? "1" : "0"); } catch (_) {} if (voiceOn) speak("Mode vocal activé. À votre service."); else stopSpeaking(); }
  if (e.target.id === "currency" && db) db.doc("settings/main").set({ ...S.settings, currency: e.target.value }).catch(toastErr);
});
async function advance(id) {
  const x = S.clients.find(c => c.id === id); if (!x || !db) return;
  const i = STAGE_ORDER.indexOf(stageOf(x)), next = STAGE_ORDER[i + 1];
  if (!next || !OPEN_STAGES.includes(stageOf(x))) return;
  try { await db.doc("clients/" + id).update({ stage: next, ...(next === "gagne" ? { wonDate: today() } : {}) }); } catch (err) { toastErr(err); }
}
let clearArmed = false;
async function clearChat(btn) {
  if (!db || !S.chat.length) return;
  if (!clearArmed) { clearArmed = true; btn.textContent = "Confirmer l'effacement"; setTimeout(() => { clearArmed = false; if (btn.isConnected) btn.textContent = "Effacer la conversation"; }, 4000); return; }
  clearArmed = false;
  for (const m of [...S.chat]) { try { await db.doc("chat/" + m.id).delete(); } catch (e) {} }
}

/* ---------- Démarrage ---------- */
render();
(async () => {
  const c = window.claude;
  if (!c || !c.use) { offline = true; $("#status").textContent = "Aperçu hors ligne"; render(); return; }
  db = await c.use("db");
  if (!db) { offline = true; $("#status").textContent = "Données indisponibles"; render(); return; }
  $("#status").textContent = "Synchronisé";
  for (const col of COLS) db.collection(col).onSnapshot(snap => { S[col] = snap.docs.map(d => ({ id: d.id, ...d.data() })); S.loaded[col] = true; render(); }, () => { $("#status").textContent = "Erreur de synchronisation"; });
  db.collection("chat").orderBy("ts", "desc").limit(80).onSnapshot(snap => { S.chat = snap.docs.map(d => ({ id: d.id, ...d.data() })).reverse(); if (view === "jarvis") updateChat(); });
  db.doc("settings/main").onSnapshot(snap => { if (snap.exists) S.settings = { currency: "EUR", ...snap.data() }; render(); });
  sample = await c.use("sample");
  render();
})();
</script>
